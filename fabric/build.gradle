plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    // Trinkets 依赖的两个 maven 仓库（TerraformersMC + Ladysnake）
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Ladysnake Libs"
        url = "https://maven.ladysnake.org/releases"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modCompileOnly "maven.modrinth:jade:15.10.5+fabric"
    modRuntimeOnly "maven.modrinth:jade:15.10.5+fabric"

    // Trinkets：可选联动，仅编译期引用 API，运行时由玩家自行安装
    modCompileOnly "dev.emi:trinkets:${trinkets_version}"
    // 本地运行测试时自动拉取 trinkets 及其传递依赖（CCA）
    modRuntimeOnly "dev.emi:trinkets:${trinkets_version}"

    // Artifacts：使用 common 装备 provider API；NeoForge jar 仅作为 Mojang mappings 编译来源
    compileOnly "maven.modrinth:artifacts:${artifacts_version}"

    // ModMenu：可选联动，编译期引用 API，开发环境运行时拉取以便测试配置界面
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    modRuntimeOnly "com.terraformersmc:modmenu:${modmenu_version}"

    // Lootr：fabric 端 compileOnly 引用 neoforge jar（named mappings，与项目映射一致）
    // 不使用 modCompileOnly：Lootr jar 由 Loom 1.14+ 构建，项目 Loom 1.8 无法 remap
    // neoforge jar 中的 common API 类与 fabric jar 相同，仅编译期引用
    if (project.hasProperty('lootr_compat') ? project.lootr_compat.toBoolean() : true) {
        compileOnly "maven.modrinth:lootr:${lootr_version}"
    }
    // 开发环境运行时需手动将 Lootr fabric jar 放入 runs/client/mods 目录
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            // 固定开发环境玩家身份，避免每次启动 UUID 随机导致玩家数据/调试状态丢失
            programArgs.addAll('--username', 'Dev', '--uuid', '12345678-1234-1234-1234-123456789abc')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
