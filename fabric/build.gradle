plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

def lootrCompat = project.hasProperty('lootr_compat_fabric') ? project.lootr_compat_fabric.toBoolean() : true

configurations {
    // Lootr 使用比本项目更新的 Loom 构建，交由 Fabric Loader 在开发运行时完成 remap。
    lootrFabricRuntime {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    // Trinkets 依赖的两个 maven 仓库（TerraformersMC + Ladysnake）
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        name = "Ladysnake Libs"
        url = "https://maven.ladysnake.org/releases"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modCompileOnly "maven.modrinth:jade:15.10.5+fabric"
    modRuntimeOnly "maven.modrinth:jade:15.10.5+fabric"

    // Trinkets：可选联动，仅编译期引用 API，运行时由玩家自行安装
    modCompileOnly "dev.emi:trinkets:${trinkets_version}"
    // 本地运行测试时自动拉取 trinkets 及其传递依赖（CCA）
    modRuntimeOnly "dev.emi:trinkets:${trinkets_version}"

    // Artifacts：仅使用 NeoForge jar 作为 Mojang mappings 编译来源；运行测试由 mods 目录提供完整 Fabric JAR
    compileOnly "maven.modrinth:artifacts:${artifacts_version}"

    // ModMenu：可选联动，编译期引用 API，开发环境运行时拉取以便测试配置界面
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    modRuntimeOnly "com.terraformersmc:modmenu:${modmenu_version}"

    // Lootr：编译期使用 NeoForge 的 Mojang mappings JAR，开发运行时加载对应的 Fabric JAR。
    // Fabric 文件需使用 Modrinth version id；语义版本坐标默认解析到 NeoForge 文件。
    if (lootrCompat) {
        compileOnly "maven.modrinth:lootr:${lootr_version}"
        lootrFabricRuntime "maven.modrinth:lootr:${lootr_fabric_version_id}"
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            // 固定开发环境玩家身份，避免每次启动 UUID 随机导致玩家数据/调试状态丢失
            programArgs.addAll('--username', 'Dev', '--uuid', '12345678-1234-1234-1234-123456789abc')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

if (lootrCompat) {
    tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
        doFirst {
            systemProperty 'fabric.addMods', configurations.lootrFabricRuntime.singleFile.absolutePath
        }
    }
}

if (!lootrCompat) {
    tasks.named('processResources') {
        inputs.property('lootrCompatFabric', lootrCompat)
        doLast {
            def metadataFile = destinationDir.toPath().resolve('fabric.mod.json').toFile()
            def metadata = new groovy.json.JsonSlurper().parse(metadataFile)
            metadata.entrypoints.remove('preLaunch')
            metadata.suggests.remove('lootr')
            metadataFile.text = groovy.json.JsonOutput.prettyPrint(
                    groovy.json.JsonOutput.toJson(metadata)) + System.lineSeparator()
        }
    }
}
