plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    // Trinkets 依赖的两个 maven 仓库（TerraformersMC + Ladysnake）
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Ladysnake Libs"
        url = "https://maven.ladysnake.org/releases"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modCompileOnly "maven.modrinth:jade:15.10.5+fabric"
    modRuntimeOnly "maven.modrinth:jade:15.10.5+fabric"

    // Trinkets：可选联动，仅编译期引用 API，运行时由玩家自行安装
    modCompileOnly "dev.emi:trinkets:${trinkets_version}"
    // 本地运行测试时自动拉取 trinkets 及其传递依赖（CCA）
    modRuntimeOnly "dev.emi:trinkets:${trinkets_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            // 固定开发环境玩家身份，避免每次启动 UUID 随机导致玩家数据/调试状态丢失
            programArgs.addAll('--username', 'Dev', '--uuid', '12345678-1234-1234-1234-123456789abc')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}