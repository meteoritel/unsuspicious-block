name: Source checks

on:
  pull_request:
  push:
    branches: ['1.21.1']

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check repository sources
        run: python tools/checks/check-all.py
