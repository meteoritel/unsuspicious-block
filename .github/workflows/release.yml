
name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check release version and extract changelog
        run: |
          version=$(awk -F= '$1 == "version" {print $2}' gradle.properties)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $version"
            exit 1
          fi

          awk -v heading="## [$version]" '
            $0 == heading {section = 1; next}
            section && /^## \[/ {exit}
            section {print}
          ' CHANGELOG.md > RELEASE_CHANGELOG.md
          if ! grep -q '[^[:space:]]' RELEASE_CHANGELOG.md; then
            echo "No changelog found for version $version"
            exit 1
          fi

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Collect release jars
        id: release_jars
        run: |
          version=${GITHUB_REF_NAME#v}
          mod_id=$(awk -F= '$1 == "mod_id" {print $2}' gradle.properties)
          minecraft_version=$(awk -F= '$1 == "minecraft_version" {print $2}' gradle.properties)
          jars=()
          for loader in fabric neoforge; do
            jar="$loader/build/libs/$mod_id-$loader-$minecraft_version-$version.jar"
            if [[ ! -f "$jar" ]]; then
              echo "Missing release jar: $jar"
              exit 1
            fi
            jars+=("$jar")
          done

          {
            echo 'files<<EOF'
            printf '%s\n' "${jars[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.release_jars.outputs.files }}
          body_path: RELEASE_CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
