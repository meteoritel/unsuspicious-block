plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // IMixinConfigPlugin 依赖 ASM ClassNode，mixin 0.8.5 未传递暴露，需显式声明
    compileOnly "org.ow2.asm:asm-tree:9.7.1"
    compileOnly "org.ow2.asm:asm-commons:9.7.1"
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    // Jade API (common API classes are the same across platforms)
    compileOnly "maven.modrinth:jade:15.10.5+neoforge"
    // Lootr API（Modrinth maven，neoforge 平台 jar，common API 类与 fabric 端一致）
    if (project.hasProperty('lootr_compat') ? project.lootr_compat.toBoolean() : true) {
        compileOnly "maven.modrinth:lootr:${lootr_version}"
    }

    // ========== test ========== //

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

def lootrCompat = project.hasProperty('lootr_compat') ? project.lootr_compat.toBoolean() : true
if (!lootrCompat) {
    tasks.named('compileJava', JavaCompile) {
        exclude 'com/meteorite/unsuspiciousblock/mixin/compat/lootr/**'
        exclude 'com/meteorite/unsuspiciousblock/plugin/lootr/**'
    }
    tasks.named('javadoc', Javadoc) {
        exclude 'com/meteorite/unsuspiciousblock/mixin/compat/lootr/**'
        exclude 'com/meteorite/unsuspiciousblock/plugin/lootr/**'
    }
    tasks.named('sourcesJar', Jar) {
        exclude 'com/meteorite/unsuspiciousblock/mixin/compat/lootr/**'
        exclude 'com/meteorite/unsuspiciousblock/plugin/lootr/**'
        exclude 'unsuspiciousblock.lootr.mixins.json'
        exclude 'META-INF/services/noobanidus.mods.lootr.common.api.filter.ILootrFilterProvider'
    }
    tasks.named('processResources', ProcessResources) {
        exclude 'unsuspiciousblock.lootr.mixins.json'
        exclude 'META-INF/services/noobanidus.mods.lootr.common.api.filter.ILootrFilterProvider'
    }
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

