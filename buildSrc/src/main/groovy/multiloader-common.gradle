plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.addBooleanOption('Xdoclint:-missing', true)
    options.addBooleanOption('quiet', true)
}

repositories {
    exclusiveContent {
        forRepository { maven {
            name = 'MeteosUiKit'
            url = 'https://meteoritel.github.io/meteo-s-ui-kit/'
        } }
        filter { includeGroup('com.meteorite.meteosuikit') }
    }
    mavenCentral()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

def lootrPlatforms = [
        fabric: providers.gradleProperty('lootr_compat_fabric').orElse('true').get().toBoolean(),
        neoforge: providers.gradleProperty('lootr_compat_neoforge').orElse('true').get().toBoolean()
]
ext.lootrCompatEnabled = project.name == 'common'
        ? lootrPlatforms.values().any { it }
        : lootrPlatforms[project.name]

String lootrArtifactVersion = lootr_version
String minecraftVersionPrefix = "${minecraft_version}-"
ext.lootrDependency = "maven.modrinth:lootr:${lootrArtifactVersion}"
ext.lootrModVersion = lootrArtifactVersion.startsWith(minecraftVersionPrefix)
        ? lootrArtifactVersion.substring(minecraftVersionPrefix.length())
        : lootrArtifactVersion

if (!lootrCompatEnabled) {
    def lootrSources = [
            'com/meteorite/unsuspiciousblock/core/mixin/compat/lootr/**',
            'com/meteorite/unsuspiciousblock/core/plugin/lootr/**'
    ]
    def lootrResources = [
            "${mod_id}.lootr.mixins.json".toString(),
            'META-INF/services/noobanidus.mods.lootr.common.api.filter.ILootrFilterProvider'
    ]
    tasks.named('compileJava', JavaCompile) { exclude lootrSources }
    tasks.named('javadoc', Javadoc) { exclude lootrSources }
    tasks.named('processResources', ProcessResources) { exclude lootrResources }
    tasks.named('sourcesJar', Jar) { exclude lootrSources + lootrResources }
}

ext.modMetadata = [
        version: project.version,
        minecraft_version: minecraft_version,
        mod_name: mod_name,
        mod_author: mod_author,
        mod_id: mod_id,
        license: license,
        description: project.description,
        meteos_ui_kit_version: meteos_ui_kit_version
]

processResources {
    def resourceMetadata = modMetadata.subMap(['mod_name', 'mod_id'])
    inputs.properties(resourceMetadata)
    filesMatching(['pack.mcmeta', '*.mixins.json']) {
        expand resourceMetadata
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url System.getenv('local_maven_url')
        }
    }
}
