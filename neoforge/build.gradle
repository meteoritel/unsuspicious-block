import groovy.json.JsonSlurper

plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    // Curios API maven 仓库（仅 neoforge 端可选联动）
    maven {
        name = "Curios"
        url = "https://maven.theillusivec4.top/"
    }
    exclusiveContent {
        forRepository { maven {
            name = 'ModMaven'
            url = 'https://modmaven.dev/'
        } }
        filter { includeModule('mekanism', 'Mekanism') }
    }
}

dependencies {
    implementation "com.meteorite.meteosuikit:meteos-ui-kit-neoforge-1.21.1:${meteos_ui_kit_version}"
    jarJar("com.meteorite.meteosuikit:meteos-ui-kit-neoforge-1.21.1:${meteos_ui_kit_version}") {
        version { strictly("[${meteos_ui_kit_version}]"); prefer(meteos_ui_kit_version) }
    }
    compileOnly "maven.modrinth:jade:15.10.5+neoforge"
    runtimeOnly "maven.modrinth:jade:15.10.5+neoforge"

    // JEI：API 仅用于编译，完整模组只在开发运行环境中加载
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Curios API：compileOnly 引用 API，runtimeOnly 供本地运行测试
    // 发布时不强制玩家安装 Curios，仅在存在时启用联动功能
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // Artifacts：仅编译其装备 provider API，运行时仍保持可选联动
    compileOnly "maven.modrinth:artifacts:${artifacts_version}"

    compileOnly "mekanism:Mekanism:${mekanism_version}:api"
    compileOnly "maven.modrinth:create:${create_version}"

    // Lootr：neoforge 端 compileOnly 引用 API，runtimeOnly 供本地运行测试
    if (lootrCompatEnabled) {
        compileOnly lootrDependency
        runtimeOnly lootrDependency
    }
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            // 慢表归因期间为开发客户端开启观测，IDEA 的 Gradle 面板启动同样生效。
            systemProperty('usb.loot.profile', 'true')
            // 为 IDEA / Gradle 开发客户端开启战利品调试模式，考古笔记出现「开发者调试」分类。
            systemProperty('usb.loot.debug', 'true')
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

processResources {
    def lootrDependencyMetadata = lootrCompatEnabled ? """[[dependencies.${mod_id}]]
    modId = "lootr"
    type = "optional"
    ordering = "NONE"
    side = "BOTH"
""" : ''
    def lootrMixinMetadata = lootrCompatEnabled ? """[[mixins]]
config = "${mod_id}.lootr-neoforge.mixins.json"
requiredMods = ["lootr"]
""" : ''
    def neoForgeMetadata = modMetadata + [
            neoforge_loader_version_range: neoforge_loader_version_range,
            neoforge_version: neoforge_version,
            mekanism_neoforge_version_range: mekanism_neoforge_version_range,
            lootr_neoforge_dependency: lootrDependencyMetadata,
            lootr_neoforge_mixin: lootrMixinMetadata
    ]
    inputs.properties(neoForgeMetadata)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand neoForgeMetadata
    }
    exclude "${mod_id}.lootr.mixins.json".toString()
    if (lootrCompatEnabled) {
        def sharedConfig = rootProject.file("common/src/main/resources/${mod_id}.lootr.mixins.json")
        inputs.file(sharedConfig)
        def lootrActivation = [
                versions: lootr_neoforge_versions,
                mixins: new JsonSlurper().parse(sharedConfig).mixins.join(',')
        ]
        inputs.properties(lootrActivation)
        filesMatching("${mod_id}.lootr-neoforge.properties".toString()) {
            expand lootrActivation
        }
    }
}
